services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data

  storage-1:
    build: .
    environment:
      PORT: "50051"
      DATA_DIR: /data
      NODE_ID: storage-1
      ETCD_ENDPOINT: http://etcd:2379
    depends_on:
      - etcd
    ports:
      - "50051:50051"
    volumes:
      - storage-1-data:/data

  storage-2:
    build: .
    environment:
      PORT: "50051"
      DATA_DIR: /data
      NODE_ID: storage-2
      ETCD_ENDPOINT: http://etcd:2379
    depends_on:
      - etcd
    ports:
      - "50052:50051"
    volumes:
      - storage-2-data:/data

volumes:
  etcd-data:
  storage-1-data:
  storage-2-data: