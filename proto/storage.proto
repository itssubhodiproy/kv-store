syntax = "proto3";

package kv;

service Storage {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  string value = 2;
  uint64 version = 3;
  bool deleted = 4;
}

message PutRequest {
  string key = 1;
  string value = 2;
  uint64 version = 3;
}

message PutResponse {}

message DeleteRequest {
  string key = 1;
  uint64 version = 2;
}

message DeleteResponse {}